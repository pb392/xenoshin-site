name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r rag/requirements.txt pytest httpx
      - name: RAG tests (core + web)
        run: python -m pytest -v rag/tests
      - name: Portfolio link and structure checks
        run: python scripts/check_site.py
      - name: Shell syntax
        run: sh -n deploy/setup.sh && sh -n deploy/auto-deploy.sh && sh -n deploy/backup.sh
      - name: Build images
        run: |
          docker build -t xenoshin-rag:ci --build-arg GIT_COMMIT=${{ github.sha }} rag
          docker build -t xenoshin-portfolio:ci portfolio
      - name: Container smoke test (no API key, keyword-only mode)
        run: |
          docker run -d --name rag -p 8000:8000 xenoshin-rag:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/health | python -c "import json,sys; h=json.load(sys.stdin); assert h['chunks']>0 and h['sources']==7, h; print('health ok', h)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/admin/import)" = 401
          docker run -d --name web -p 8080:8080 xenoshin-portfolio:ci
          sleep 2
          curl -fs http://127.0.0.1:8080/ | grep -q "I build and test the systems behind games"
          echo "smoke ok"
      - name: Restart, repeat-import and backup/restore drill (named volume, like the server)
        run: |
          cat > drill.yaml <<'YAML'
          services:
            rag:
              image: xenoshin-rag:ci
              volumes: [drill-data:/data]
          volumes:
            drill-data:
          YAML
          export COMPOSE="docker compose -f drill.yaml -p drill"
          $COMPOSE up -d
          runs() { $COMPOSE exec -T rag python -c "import sqlite3; print(sqlite3.connect('/data/rag.sqlite3').execute('select count(*) from import_runs').fetchone()[0])"; }
          for i in $(seq 1 30); do $COMPOSE exec -T rag test -s /data/last-import.json && break; sleep 2; done
          test "$(runs)" = 1
          $COMPOSE restart rag; sleep 8
          test "$(runs)" = 2                                   # data survived the restart
          $COMPOSE exec -T rag python -c "import json; r=json.load(open('/data/last-import.json')); assert all(s['new']==0 and s['changed']==0 for s in r['sources']), r; print('repeat import: 0 new, 0 changed')"
          HOME=$PWD sh deploy/backup.sh backup
          $COMPOSE down -v                                     # destroy the container AND the volume
          $COMPOSE up -d; sleep 8
          test "$(runs)" = 1                                   # fresh volume: history is gone
          HOME=$PWD sh deploy/backup.sh restore backups/rag-*.sqlite3; sleep 8
          test "$(runs)" -ge 2                                 # history is back after restore
          echo "drill ok"; $COMPOSE down -v
      - name: Keyboard and phone-width checks (Playwright, against the CI containers)
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          python scripts/check_ui.py http://127.0.0.1:8080 / /about.html /projects/elestrals-rag.html /projects/ci-cd.html /projects/group.html /404.html
          python scripts/check_ui.py http://127.0.0.1:8000 / /sources /sources/S5-premier-2026-11-21 /import-record

  release:
    # The server deploys only this branch, so it moves only after every check passed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance release branch
        run: git push origin HEAD:refs/heads/release --force
