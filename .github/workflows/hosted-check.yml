name: Hosted check

# Runs the evaluation questions against the LIVE app and commits the actual
# responses, so the record can link to dated, observed hosted results.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check both sites respond over HTTPS
        run: |
          curl -fsS https://xenoshin.com/ | grep -q "I build and test the systems behind games"
          curl -fsS https://rag.xenoshin.com/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://rag.xenoshin.com/admin/import)" = 401
      - name: Run evaluation questions
        run: python rag/eval/run_eval.py https://rag.xenoshin.com rag/eval/hosted/$(date -u +%Y-%m-%d)
      - name: Open every portfolio link
        run: |
          OUT=rag/eval/hosted/$(date -u +%Y-%m-%d)
          python scripts/check_links.py https://xenoshin.com $OUT/links.md / /about.html /projects/elestrals-rag.html /projects/ci-cd.html /projects/group.html || echo links >> failed.txt
      - name: Keyboard and phone-width checks on the live sites
        run: |
          OUT=rag/eval/hosted/$(date -u +%Y-%m-%d)
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
          { echo '# Keyboard and phone-width check (hosted)'; echo; echo '```'
            python scripts/check_ui.py https://xenoshin.com / /about.html /projects/elestrals-rag.html /projects/ci-cd.html /projects/group.html /404.html || echo ui >> failed.txt
            python scripts/check_ui.py https://rag.xenoshin.com / /sources /sources/S5-premier-2026-11-21 /import-record || echo ui >> failed.txt
            echo '```'; } > $OUT/ui.md
          cat $OUT/ui.md
      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/eval/hosted
          git commit -m "Hosted evaluation results $(date -u +%FT%TZ) [skip ci]" || echo "nothing to commit"
          git push
      - name: Fail if a link or UI check failed (results are still saved above)
        run: test ! -f failed.txt || { cat failed.txt; exit 1; }
